<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Birthstone&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
body { background: #0b0c0a; color: #f5f2eb; padding: 40px; font-family: sans-serif; }
.card { margin-bottom: 40px; border-bottom: 1px solid #222; padding-bottom: 24px; }
.sandra-alex { font-family: 'Alex Brush', cursive; font-size: 84px; color: #d4a373; line-height: 1; }
.sandra-allura { font-family: 'Allura', cursive; font-size: 88px; color: #d4a373; line-height: 1; }
.sandra-vibes { font-family: 'Great Vibes', cursive; font-size: 84px; color: #d4a373; line-height: 1; }
.sandra-birthstone { font-family: 'Birthstone', cursive; font-size: 104px; color: #d4a373; line-height: 1; }
.de-manuel-cinzel { font-family: 'Cinzel', serif; font-size: 24px; letter-spacing: 0.35em; color: #f5f2eb; text-transform: uppercase; margin-top: 4px; }
.de-manuel-cormorant { font-family: 'Cormorant Garamond', serif; font-size: 28px; letter-spacing: 0.32em; color: #f5f2eb; text-transform: uppercase; margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <div style="color:#777; margin-bottom: 8px;">1. Alex Brush + Cinzel</div>
    <div class="sandra-alex">Sandra</div>
    <div class="de-manuel-cinzel">DE MANUEL</div>
  </div>
  <div class="card">
    <div style="color:#777; margin-bottom: 8px;">2. Allura + Cinzel</div>
    <div class="sandra-allura">Sandra</div>
    <div class="de-manuel-cinzel">DE MANUEL</div>
  </div>
  <div class="card">
    <div style="color:#777; margin-bottom: 8px;">3. Great Vibes + Cormorant Garamond</div>
    <div class="sandra-vibes">Sandra</div>
    <div class="de-manuel-cormorant">DE MANUEL</div>
  </div>
  <div class="card">
    <div style="color:#777; margin-bottom: 8px;">4. Birthstone + Cinzel</div>
    <div class="sandra-birthstone">Sandra</div>
    <div class="de-manuel-cinzel">DE MANUEL</div>
  </div>
</body>
</html>

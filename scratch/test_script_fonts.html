<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Carattere&family=Cherish&family=Ephesis&family=Great+Vibes&family=Imperial+Script&family=Mea+Culpa&family=MonteCarlo&family=Playwrite+ES:wght@300;400&family=WindSong:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body { background: #0b0c0a; color: #f5f2eb; padding: 30px; font-family: sans-serif; }
.row { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; padding: 15px 0; }
.name { font-size: 72px; color: #d4a373; line-height: 1; }
.sub { font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 0.35em; color: #f5f2eb; margin-top: 6px; }
.lbl { width: 180px; color: #888; font-size: 14px; }
</style>
</head>
<body>
  <div class="row">
    <div class="lbl">Alex Brush</div>
    <div>
      <div class="name" style="font-family: 'Alex Brush', cursive;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Great Vibes</div>
    <div>
      <div class="name" style="font-family: 'Great Vibes', cursive;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Carattere</div>
    <div>
      <div class="name" style="font-family: 'Carattere', cursive; font-size: 82px;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Ephesis</div>
    <div>
      <div class="name" style="font-family: 'Ephesis', cursive; font-size: 82px;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">WindSong</div>
    <div>
      <div class="name" style="font-family: 'WindSong', cursive; font-size: 78px;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Cherish</div>
    <div>
      <div class="name" style="font-family: 'Cherish', cursive; font-size: 78px;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Imperial Script</div>
    <div>
      <div class="name" style="font-family: 'Imperial Script', cursive; font-size: 88px;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
</body>
</html>

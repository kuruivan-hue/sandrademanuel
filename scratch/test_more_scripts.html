<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Cinzel:wght@400;500;600&family=Great+Vibes&family=Italianno&family=Monsieur+La+Doulaise&family=Mrs+Saint+Delafield&family=Parisienne&family=Pinyon+Script&family=Rouge+Script&family=Tangerine:wght@700&display=swap" rel="stylesheet">
<style>
body { background: #0b0c0a; color: #f5f2eb; padding: 30px; font-family: sans-serif; }
.row { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #222; padding: 10px 0; }
.s { font-size: 80px; color: #e5c5a8; line-height: 1; }
.sub { font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 0.35em; color: #f5f2eb; text-transform: uppercase; margin-top: 4px; }
.lbl { width: 220px; color: #888; font-size: 15px; }
</style>
</head>
<body>
  <div class="row">
    <div class="lbl">Great Vibes</div>
    <div>
      <div class="s" style="font-family: 'Great Vibes', cursive;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Alex Brush</div>
    <div>
      <div class="s" style="font-family: 'Alex Brush', cursive;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Allura</div>
    <div>
      <div class="s" style="font-family: 'Allura', cursive;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Pinyon Script</div>
    <div>
      <div class="s" style="font-family: 'Pinyon Script', cursive;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Parisienne</div>
    <div>
      <div class="s" style="font-family: 'Parisienne', cursive;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Italianno</div>
    <div>
      <div class="s" style="font-family: 'Italianno', cursive; font-size: 96px;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Tangerine</div>
    <div>
      <div class="s" style="font-family: 'Tangerine', cursive; font-size: 96px; font-weight: 700;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>
  <div class="row">
    <div class="lbl">Monsieur La Doulaise</div>
    <div>
      <div class="s" style="font-family: 'Monsieur La Doulaise', cursive; font-size: 90px;">Sandra</div>
      <div class="sub">DE MANUEL</div>
    </div>
  </div>

</html>
